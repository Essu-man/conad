[package]
name = "conad_pos"
version = "0.1.0"
description = "Conad POS Desktop Application"
authors = ["Conad Tech"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "conad_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.33", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

[profile.dev]
incremental = false
debug = 0

